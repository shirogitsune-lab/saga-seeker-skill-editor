name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  public-tests:
    name: Public tests (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.13"
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install public test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev,build]"

      - name: Run complete public test suite
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path work | Out-Null
          python -m pytest -q -p no:cacheprovider `
            --basetemp="work/pytest-${{ matrix.python-version }}" `
            --junitxml="work/pytest-${{ matrix.python-version }}.xml"

      - name: Publish test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-python-${{ matrix.python-version }}
          path: work/pytest-${{ matrix.python-version }}.xml
          if-no-files-found: error
          retention-days: 30

  windows-builds:
    name: Windows onedir and onefile builds
    needs: public-tests
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev,build]"

      - name: Build and verify onedir
        shell: pwsh
        run: |
          ./build.ps1 -Mode onedir -PythonPath (Get-Command python).Source
          if (-not (Test-Path "dist/SagaSeekerSkillEditor/SagaSeekerSkillEditor.exe")) {
            throw "onedir executable is missing"
          }
          $guides = Get-ChildItem "dist/SagaSeekerSkillEditor" -Filter *.html
          if ($guides.Count -ne 1) {
            throw "onedir distribution must contain exactly one HTML guide"
          }
          if (Test-Path "dist/SagaSeekerSkillEditor/user-guide-assets") {
            throw "onedir distribution contains obsolete guide assets"
          }
          ./scripts/exe_smoke.ps1 `
            -ExePath "dist/SagaSeekerSkillEditor/SagaSeekerSkillEditor.exe" `
            -Theme light -StartupSeconds 2
          New-Item -ItemType Directory -Force -Path work | Out-Null
          Copy-Item "dist/SagaSeekerSkillEditor" "work/ci-onedir" -Recurse

      - name: Build and verify onefile
        shell: pwsh
        run: |
          ./build.ps1 -Mode onefile -PythonPath (Get-Command python).Source
          if (-not (Test-Path "dist/SagaSeekerSkillEditor.exe")) {
            throw "onefile executable is missing"
          }
          $guides = Get-ChildItem "dist" -Filter *.html
          if ($guides.Count -ne 1) {
            throw "onefile distribution must contain exactly one HTML guide"
          }
          if (Test-Path "dist/user-guide-assets") {
            throw "onefile build contains obsolete guide assets"
          }
          ./scripts/exe_smoke.ps1 `
            -ExePath "dist/SagaSeekerSkillEditor.exe" `
            -Theme light -StartupSeconds 2

      - name: Assemble and verify exact release candidate
        shell: pwsh
        run: |
          python scripts/package_release_assets.py `
            "dist/SagaSeekerSkillEditor.exe" `
            "work/ci-onedir" `
            "dist/使い方.html" `
            "work/release-candidate" `
            "2.0.2"
          $archive = "work/release-candidate/SagaSeekerSkillEditor-v2.0.2-windows-x64-onedir.zip"
          Expand-Archive -LiteralPath $archive -DestinationPath "work/release-extracted"
          ./scripts/exe_smoke.ps1 `
            -ExePath "work/release-extracted/SagaSeekerSkillEditor/SagaSeekerSkillEditor.exe" `
            -Theme light -StartupSeconds 2
          ./scripts/exe_image_smoke.ps1 `
            -ExePath "work/release-extracted/SagaSeekerSkillEditor/SagaSeekerSkillEditor.exe"
          ./scripts/exe_smoke.ps1 `
            -ExePath "work/release-candidate/SagaSeekerSkillEditor-v2.0.2-windows-x64-onefile.exe" `
            -Theme light -StartupSeconds 2
          ./scripts/exe_image_smoke.ps1 `
            -ExePath "work/release-candidate/SagaSeekerSkillEditor-v2.0.2-windows-x64-onefile.exe"

      - name: Publish release-candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.sha }}
          path: work/release-candidate/*
          if-no-files-found: error
          retention-days: 30

      - name: Write verification summary
        if: success()
        shell: pwsh
        run: |
          "## CI verification" >> $env:GITHUB_STEP_SUMMARY
          "- Public tests passed on Python 3.11 and 3.13." >> $env:GITHUB_STEP_SUMMARY
          "- Windows onedir and onefile builds completed." >> $env:GITHUB_STEP_SUMMARY
          "- Packaged executables passed startup and image-codec smoke checks." >> $env:GITHUB_STEP_SUMMARY
          "- The exact four-file v2.0.2 release candidate passed ZIP, guide, and SHA-256 verification." >> $env:GITHUB_STEP_SUMMARY
          "- Artifact: release-candidate-${{ github.sha }}" >> $env:GITHUB_STEP_SUMMARY
